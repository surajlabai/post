<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup · Forgot · Firebase</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        /* === YOUR ORIGINAL STYLE (बिल्कुल नहीं बदला) === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            color: #fff;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            padding: 20px;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #fff;
        }

        .footer a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            transition: .3s;
        }

        .footer a:hover {
            text-decoration: underline;
            color: #00b8d4;
        }

        .auth-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 25px #00d4ff;
            overflow: hidden;
            background: transparent;
        }

        .auth-wrapper .credentials-panel {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            flex-direction: column;
        }

        .credentials-panel.signin {
            left: 0;
            padding: 0 40px;
        }

        .credentials-panel.signin .slide-element {
            transform: translateX(0%);
            transition: .7s;
            opacity: 1;
        }

        .credentials-panel.signin .slide-element:nth-child(1) {
            transition-delay: 2.1s;
        }

        .credentials-panel.signin .slide-element:nth-child(2) {
            transition-delay: 2.2s;
        }

        .credentials-panel.signin .slide-element:nth-child(3) {
            transition-delay: 2.3s;
        }

        .credentials-panel.signin .slide-element:nth-child(4) {
            transition-delay: 2.4s;
        }

        .credentials-panel.signin .slide-element:nth-child(5) {
            transition-delay: 2.5s;
        }

        .auth-wrapper.toggled .credentials-panel.signin .slide-element {
            transform: translateX(-120%);
            opacity: 0;
        }

        .auth-wrapper.toggled .credentials-panel.signin .slide-element:nth-child(1) {
            transition-delay: 0s;
        }

        .auth-wrapper.toggled .credentials-panel.signin .slide-element:nth-child(2) {
            transition-delay: 0.1s;
        }

        .auth-wrapper.toggled .credentials-panel.signin .slide-element:nth-child(3) {
            transition-delay: 0.2s;
        }

        .auth-wrapper.toggled .credentials-panel.signin .slide-element:nth-child(4) {
            transition-delay: 0.3s;
        }

        .auth-wrapper.toggled .credentials-panel.signin .slide-element:nth-child(5) {
            transition-delay: 0.4s;
        }

        .credentials-panel.signup {
            right: 0;
            padding: 0 60px;
        }

        .credentials-panel.signup .slide-element {
            transform: translateX(120%);
            transition: .7s ease;
            opacity: 0;
            filter: blur(10px);
        }

        .credentials-panel.signup .slide-element:nth-child(1) {
            transition-delay: 0s;
        }

        .credentials-panel.signup .slide-element:nth-child(2) {
            transition-delay: 0.1s;
        }

        .credentials-panel.signup .slide-element:nth-child(3) {
            transition-delay: 0.2s;
        }

        .credentials-panel.signup .slide-element:nth-child(4) {
            transition-delay: 0.3s;
        }

        .credentials-panel.signup .slide-element:nth-child(5) {
            transition-delay: 0.4s;
        }

        .credentials-panel.signup .slide-element:nth-child(6) {
            transition-delay: 0.5s;
        }

        .auth-wrapper.toggled .credentials-panel.signup .slide-element {
            transform: translateX(0%);
            opacity: 1;
            filter: blur(0px);
        }

        .auth-wrapper.toggled .credentials-panel.signup .slide-element:nth-child(1) {
            transition-delay: 1.7s;
        }

        .auth-wrapper.toggled .credentials-panel.signup .slide-element:nth-child(2) {
            transition-delay: 1.8s;
        }

        .auth-wrapper.toggled .credentials-panel.signup .slide-element:nth-child(3) {
            transition-delay: 1.9s;
        }

        .auth-wrapper.toggled .credentials-panel.signup .slide-element:nth-child(4) {
            transition-delay: 1.9s;
        }

        .auth-wrapper.toggled .credentials-panel.signup .slide-element:nth-child(5) {
            transition-delay: 2.0s;
        }

        .auth-wrapper.toggled .credentials-panel.signup .slide-element:nth-child(6) {
            transition-delay: 2.1s;
        }

        .credentials-panel h2 {
            font-size: 32px;
            text-align: center;
        }

        .field-wrapper {
            position: relative;
            width: 100%;
            height: 50px;
            margin-top: 25px;
        }

        .field-wrapper input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 2px solid #fff;
            padding-right: 23px;
            transition: .5s;
        }

        .field-wrapper input:focus,
        .field-wrapper input:valid {
            border-bottom: 2px solid #00d4ff;
        }

        .field-wrapper label {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            font-size: 16px;
            color: #fff;
            transition: .5s;
        }

        .field-wrapper input:focus~label,
        .field-wrapper input:valid~label {
            top: -5px;
            color: #00d4ff;
        }

        .field-wrapper i {
            position: absolute;
            top: 50%;
            right: 0;
            font-size: 18px;
            transform: translateY(-50%);
            color: #fff;
        }

        .field-wrapper input:focus~i,
        .field-wrapper input:valid~i {
            color: #00d4ff;
        }

        .submit-button {
            position: relative;
            width: 100%;
            height: 45px;
            background: transparent;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid #00d4ff;
            overflow: hidden;
            z-index: 1;
        }

        .submit-button::before {
            content: "";
            position: absolute;
            height: 300%;
            width: 100%;
            background: linear-gradient(#1a1a2e, #00d4ff, #1a1a2e, #00d4ff);
            top: -100%;
            left: 0;
            z-index: -1;
            transition: .5s;
        }

        .submit-button:hover:before {
            top: 0;
        }

        .switch-link {
            font-size: 14px;
            text-align: center;
            margin: 20px 0 10px;
        }

        .switch-link a {
            text-decoration: none;
            color: #00d4ff;
            font-weight: 600;
            cursor: pointer;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        .welcome-section {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            display: flex;
            justify-content: center;
            flex-direction: column;
        }

        .welcome-section.signin {
            right: 0;
            text-align: right;
            padding: 0 40px 60px 150px;
        }

        .welcome-section.signin .slide-element {
            transform: translateX(0);
            transition: .7s ease;
            opacity: 1;
            filter: blur(0px);
        }

        .welcome-section.signin .slide-element:nth-child(1) {
            transition-delay: 2.0s;
        }

        .welcome-section.signin .slide-element:nth-child(2) {
            transition-delay: 2.1s;
        }

        .auth-wrapper.toggled .welcome-section.signin .slide-element {
            transform: translateX(120%);
            opacity: 0;
            filter: blur(10px);
        }

        .auth-wrapper.toggled .welcome-section.signin .slide-element:nth-child(1) {
            transition-delay: 0s;
        }

        .auth-wrapper.toggled .welcome-section.signin .slide-element:nth-child(2) {
            transition-delay: 0.1s;
        }

        .welcome-section.signup {
            left: 0;
            text-align: left;
            padding: 0 150px 60px 38px;
            pointer-events: none;
        }

        .welcome-section.signup .slide-element {
            transform: translateX(-120%);
            transition: .7s ease;
            opacity: 0;
            filter: blur(10PX);
        }

        .welcome-section.signup .slide-element:nth-child(1) {
            transition-delay: 0s;
        }

        .welcome-section.signup .slide-element:nth-child(2) {
            transition-delay: 0.1s;
        }

        .auth-wrapper.toggled .welcome-section.signup .slide-element {
            transform: translateX(0%);
            opacity: 1;
            filter: blur(0);
        }

        .auth-wrapper.toggled .welcome-section.signup .slide-element:nth-child(1) {
            transition-delay: 1.7s;
        }

        .auth-wrapper.toggled .welcome-section.signup .slide-element:nth-child(2) {
            transition-delay: 1.8s;
        }

        .welcome-section h2 {
            text-transform: uppercase;
            font-size: 36px;
            line-height: 1.3;
        }

        .background-shape {
            position: absolute;
            right: 0;
            top: -5px;
            height: 600px;
            width: 850px;
            background: linear-gradient(45deg, #1a1a2e, #00d4ff);
            transform: rotate(10deg) skewY(40deg);
            transform-origin: bottom right;
            transition: 1.5s ease;
            transition-delay: 1.6s;
        }

        .auth-wrapper.toggled .background-shape {
            transform: rotate(0deg) skewY(0deg);
            transition-delay: .5s;
        }

        .secondary-shape {
            position: absolute;
            left: 250px;
            top: 100%;
            height: 700px;
            width: 850px;
            background: #1a1a2e;
            border-top: 3px solid #00d4ff;
            transform: rotate(0deg) skewY(0deg);
            transform-origin: bottom left;
            transition: 1.5s ease;
            transition-delay: .5s;
        }

        .auth-wrapper.toggled .secondary-shape {
            transform: rotate(-11deg) skewY(-41deg);
            transition-delay: 1.2s;
        }

        /* forget link (minimal addition) */
        .forget-link {
            text-align: right;
            font-size: 13px;
            margin-top: 5px;
        }

        .forget-link a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 400;
        }

        .forget-link a:hover {
            text-decoration: underline;
        }

        /* forget popup & verify popup */
        .forget-popup,
        .verify-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(3px);
        }

        .forget-card,
        .verify-card {
            background: #1e1e3f;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 30px #00d4ff;
            padding: 30px 25px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            border-radius: 12px;
        }

        .forget-card h3,
        .verify-card h3 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .forget-card .field-wrapper,
        .verify-card .field-wrapper {
            margin: 20px 0;
        }

        .close-popup {
            margin-top: 15px;
            background: transparent;
            border: 1px solid #fff;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
        }

        .close-popup:hover {
            background: #ffffff22;
        }

        .note {
            font-size: 13px;
            margin-top: 10px;
            color: #b0b0b0;
        }

        @media (max-width: 768px) {
            .auth-wrapper {
                height: auto;
                min-height: 500px;
            }

            .credentials-panel.signin,
            .credentials-panel.signup {
                padding: 40px 30px;
            }

            .welcome-section {
                display: none;
            }

            .background-shape,
            .secondary-shape {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- MAIN AUTH WRAPPER -->
    <div class="auth-wrapper" id="authWrapper">
        <div class="background-shape"></div>
        <div class="secondary-shape"></div>

        <!-- SIGN IN PANEL -->
        <div class="credentials-panel signin">
            <h2 class="slide-element">Login</h2>
            <form id="loginForm">
                <div class="field-wrapper slide-element">
                    <input type="text" id="loginUsername" required>
                    <label>Username</label>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="field-wrapper slide-element">
                    <input type="password" id="loginPassword" required>
                    <label>Password</label>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="forget-link slide-element">
                    <a href="#" id="forgetPasswordBtn">forgot password?</a>
                </div>
                <div class="field-wrapper slide-element">
                    <button class="submit-button" type="submit">Login</button>
                </div>
                <div class="switch-link slide-element">
                    <p>Don't have an account? <br> <a href="#" class="register-trigger">Sign Up</a></p>
                </div>
            </form>
        </div>

        <div class="welcome-section signin">
            <h2 class="slide-element">SURAJ AI!</h2>
        </div>

        <!-- SIGN UP PANEL -->
        <div class="credentials-panel signup">
            <h2 class="slide-element">Register</h2>
            <form id="signupForm">
                <div class="field-wrapper slide-element">
                    <input type="text" id="regUsername" required>
                    <label>Username</label>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="field-wrapper slide-element">
                    <input type="email" id="regEmail" required>
                    <label>Email</label>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="field-wrapper slide-element">
                    <input type="password" id="regPassword" required>
                    <label>Password</label>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="field-wrapper slide-element">
                    <button class="submit-button" type="submit">Register</button>
                </div>
                <div class="switch-link slide-element">
                    <p>Already have an account? <br> <a href="#" class="login-trigger">Sign In</a></p>
                </div>
            </form>
        </div>

        <div class="welcome-section signup">
            <h2 class="slide-element">SURAJ AI!</h2>
        </div>
    </div>

    <!-- FORGOT PASSWORD POPUP (Step 1: Enter Email) -->
    <div class="forget-popup" id="forgetPopup">
        <div class="forget-card">
            <h3>Reset password</h3>
            <p style="margin-bottom: 12px;">Enter your email to receive OTP</p>
            <div class="field-wrapper">
                <input type="email" id="resetEmail" required placeholder=" ">
                <label>Email address</label>
                <i class="fa-solid fa-envelope"></i>
            </div>
            <button class="submit-button" id="sendOtpBtn">Send OTP</button>
            <div class="note" id="otpMessage"></div>
            <button class="close-popup" id="closePopupBtn">Close</button>
        </div>
    </div>

    <!-- VERIFY OTP POPUP (Step 2: Enter OTP & New Password) -->
    <div class="verify-popup" id="verifyPopup">
        <div class="verify-card">
            <h3>Verify OTP</h3>
            <p style="margin-bottom: 12px;">Enter the 6-digit OTP sent to your email</p>
            <div class="field-wrapper">
                <input type="text" id="otpInput" required placeholder=" ">
                <label>OTP Code</label>
                <i class="fa-solid fa-key"></i>
            </div>
            <div class="field-wrapper">
                <input type="password" id="newPassword" required placeholder=" ">
                <label>New Password</label>
                <i class="fa-solid fa-lock"></i>
            </div>
            <button class="submit-button" id="verifyOtpBtn">Verify & Reset</button>
            <div class="note" id="verifyMessage"></div>
            <button class="close-popup" id="closeVerifyBtn">Close</button>
        </div>
    </div>

    <div class="footer">
        <p>Made with ❤️ by <a href="#" target="_blank">surajAI</a></p>
    </div>

    <!-- Firebase & EmailJS SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <script>
        (function () {
            // 🔥 FIREBASE CONFIG
            const firebaseConfig = {
                databaseURL: "https://surajpostfree-default-rtdb.asia-southeast1.firebasedatabase.app/"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            // 📧 EMAILJS INIT
            emailjs.init("87W77nDgV54nbzBk4");

            // DOM elements
            const authWrapper = document.getElementById('authWrapper');
            const loginTrigger = document.querySelector('.login-trigger');
            const registerTrigger = document.querySelector('.register-trigger');
            const forgetBtn = document.getElementById('forgetPasswordBtn');
            const forgetPopup = document.getElementById('forgetPopup');
            const verifyPopup = document.getElementById('verifyPopup');
            const closePopup = document.getElementById('closePopupBtn');
            const closeVerify = document.getElementById('closeVerifyBtn');
            const sendOtpBtn = document.getElementById('sendOtpBtn');
            const verifyOtpBtn = document.getElementById('verifyOtpBtn');
            const resetEmail = document.getElementById('resetEmail');
            const otpMessage = document.getElementById('otpMessage');
            const verifyMessage = document.getElementById('verifyMessage');
            const otpInput = document.getElementById('otpInput');
            const newPassword = document.getElementById('newPassword');

            // OTP storage
            let currentOtp = '';
            let currentEmail = '';

            // Toggle panels
            registerTrigger.addEventListener('click', (e) => {
                e.preventDefault();
                authWrapper.classList.add('toggled');
            });

            loginTrigger.addEventListener('click', (e) => {
                e.preventDefault();
                authWrapper.classList.remove('toggled');
            });

            // Open forgot popup
            forgetBtn.addEventListener('click', (e) => {
                e.preventDefault();
                forgetPopup.style.display = 'flex';
                verifyPopup.style.display = 'none';
                otpMessage.textContent = '';
            });

            // Close popups
            closePopup.addEventListener('click', () => {
                forgetPopup.style.display = 'none';
            });
            closeVerify.addEventListener('click', () => {
                verifyPopup.style.display = 'none';
            });

            // Send OTP via EmailJS
            sendOtpBtn.addEventListener('click', function (e) {
                e.preventDefault();
                const email = resetEmail.value.trim();
                if (!email) {
                    otpMessage.textContent = '❌ Please enter email';
                    return;
                }

                // Check if email exists in Firebase
                db.ref('users').orderByChild('email').equalTo(email).once('value', (snapshot) => {
                    if (!snapshot.exists()) {
                        otpMessage.textContent = '❌ Email not registered';
                        return;
                    }

                    // Generate 6-digit OTP
                    const otp = Math.floor(100000 + Math.random() * 900000).toString();
                    currentOtp = otp;
                    currentEmail = email;

                    // EmailJS send
                    emailjs.send('service_aojgipa', 'template_hmwkbmr', {
                        to_email: email,
                        otp_code: otp,
                        from_name: 'SurajAI'
                    }).then(() => {
                        otpMessage.textContent = '✅ OTP sent successfully!';
                        // Close forget popup & open verify popup
                        setTimeout(() => {
                            forgetPopup.style.display = 'none';
                            verifyPopup.style.display = 'flex';
                            verifyMessage.textContent = '';
                        }, 1000);
                    }).catch((error) => {
                        console.error(error);
                        otpMessage.textContent = '❌ Failed to send OTP';
                    });
                });
            });

            // Verify OTP and Update Password
            verifyOtpBtn.addEventListener('click', function (e) {
                e.preventDefault();
                const enteredOtp = otpInput.value.trim();
                const newPass = newPassword.value.trim();

                if (!enteredOtp || !newPass) {
                    verifyMessage.textContent = '❌ Please fill all fields';
                    return;
                }

                if (enteredOtp !== currentOtp) {
                    verifyMessage.textContent = '❌ Invalid OTP';
                    return;
                }

                // Find user by email and update password
                db.ref('users').orderByChild('email').equalTo(currentEmail).once('value', (snapshot) => {
                    const users = snapshot.val();
                    const userId = Object.keys(users)[0];

                    db.ref('users/' + userId).update({
                        password: newPass
                    }).then(() => {
                        verifyMessage.textContent = '✅ Password updated!';
                        setTimeout(() => {
                            verifyPopup.style.display = 'none';
                            otpInput.value = '';
                            newPassword.value = '';
                        }, 1500);
                    }).catch(err => {
                        verifyMessage.textContent = '❌ Error updating password';
                    });
                });
            });

            // ============================================================
            // ✅ SIGNUP - सफल होने पर रीडायरेक्ट
            // ============================================================
            document.getElementById('signupForm').addEventListener('submit', function (e) {
                e.preventDefault();
                const username = document.getElementById('regUsername').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value.trim();

                if (!username || !email || !password) {
                    alert('All fields required');
                    return;
                }

                const newUserRef = db.ref('users').push();
                newUserRef.set({
                    username: username,
                    email: email,
                    password: password,
                    createdAt: new Date().toISOString()
                }).then(() => {
                    alert('✅ Registration successful!');
                    document.getElementById('signupForm').reset();

                    // 🚀 रीडायरेक्ट यहाँ होगा
                    window.location.href = 'https://surajlabai.github.io/aipost';

                }).catch(err => {
                    alert('Error: ' + err.message);
                });
            });

            // ============================================================
            // ✅ LOGIN - सफल होने पर रीडायरेक्ट
            // ============================================================
            document.getElementById('loginForm').addEventListener('submit', function (e) {
                e.preventDefault();
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value.trim();

                db.ref('users').once('value', (snapshot) => {
                    const users = snapshot.val();
                    let found = false;
                    for (let key in users) {
                        if (users[key].username === username && users[key].password === password) {
                            found = true;
                            break;
                        }
                    }
                    if (found) {
                        alert('✅ Login successful!');

                        // 🚀 रीडायरेक्ट यहाँ होगा
                        window.location.href = 'https://surajlabai.github.io/aipost';

                    } else {
                        alert('❌ Invalid username or password');
                    }
                });
            });

            // Close popup when clicking outside
            window.addEventListener('click', (e) => {
                if (e.target === forgetPopup) forgetPopup.style.display = 'none';
                if (e.target === verifyPopup) verifyPopup.style.display = 'none';
            });

        })();
    </script>
</body>

</html>
